<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="GymKey helps you train without the scroll. Tap in, train and tap out.">
    <meta property="og:title" content="GymKey — Train without the scroll.">
    <meta property="og:description" content="Tap in. Train. Tap out.">
    <meta property="og:image" content="assets/gymkey-product-cutout-v3.png">
    <title>GymKey — Train without the scroll.</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body data-checkout-endpoint="">
    <a class="skip-link" href="#offer">Skip to offer</a>

    <main class="product-page" data-unit-price-cents="8900">
      <header class="masthead" aria-label="GymKey">
        <a class="brand" href="./" aria-label="GymKey home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>GYMKEY</span>
        </a>
      </header>

      <div class="product-shell">
        <section class="product-visual" data-product-stage aria-label="GymKey product">
          <figure class="product-entry">
            <picture class="product-object" data-product-object>
              <source srcset="assets/gymkey-product-cutout-v3.webp" type="image/webp">
              <img src="assets/gymkey-product-cutout-v3.png" alt="Matte-black GymKey with lime accent and stainless keyring" width="1536" height="1024" fetchpriority="high">
            </picture>
          </figure>
        </section>

        <section class="purchase" id="offer" aria-labelledby="product-name">
          <h1 id="product-name">Train without<br>the scroll.</h1>

          <div class="offer-row">
            <div class="price-block">
              <p class="price"><span data-total-price>A$89</span></p>
              <p class="price-note">Provisional · incl. GST</p>
            </div>

            <div class="quantity-field">
              <span class="field-label" id="quantity-label">Quantity</span>
              <div class="stepper" role="group" aria-labelledby="quantity-label">
                <button type="button" data-quantity-decrease aria-label="Decrease quantity">−</button>
                <output data-quantity aria-live="polite">1</output>
                <button type="button" data-quantity-increase aria-label="Increase quantity">+</button>
              </div>
            </div>
          </div>

          <div class="checkout">
            <button class="checkout-button" type="button" data-checkout-button disabled>
              <span data-checkout-label>Pre-orders opening soon</span>
              <span aria-hidden="true">↗</span>
            </button>
            <p class="checkout-status" data-checkout-status aria-live="polite"></p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
