<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2efe6">
    <meta name="description" content="GymKey is the physical key for focused training. Train without the scroll.">
    <meta property="og:title" content="GymKey — Train without the scroll.">
    <meta property="og:description" content="A physical key for focused training. Join the GymKey waitlist.">
    <meta property="og:image" content="assets/gymkey-hero-premium-v2.png">
    <title>GymKey — Train without the scroll.</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" class="hero">
      <header class="masthead" aria-label="GymKey">
        <a class="brand" href="./" aria-label="GymKey home">
          <span class="brand-glyph" aria-hidden="true">G<span></span></span>
          <span>GYMKEY</span>
        </a>
        <p>Hardware for focused training</p>
      </header>

      <section class="hero-copy" aria-labelledby="hero-title">
        <p class="eyebrow"><span aria-hidden="true"></span> iPhone-first · Coming soon</p>
        <h1 id="hero-title">Train without<br>the scroll.</h1>
        <p class="lede">Tap in. Keep your workout and music. Leave the distractions behind.</p>

        <form class="waitlist" data-waitlist-form novalidate>
          <label class="sr-only" for="waitlist-email">Email address</label>
          <div class="waitlist-control">
            <input id="waitlist-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Email address" required aria-describedby="waitlist-status">
            <button type="submit">Join the waitlist <span aria-hidden="true">↗</span></button>
          </div>
          <p id="waitlist-status" class="form-status" data-waitlist-status aria-live="polite">No spam. Just launch access.</p>
        </form>
      </section>

      <figure class="product">
        <div class="product-halo" aria-hidden="true"></div>
        <picture>
          <source srcset="assets/gymkey-hero-premium-v2.webp" type="image/webp">
          <img src="assets/gymkey-hero-premium-v2.png" alt="Matte-black GymKey with embossed wordmark, lime accent and a stainless keyring" width="1254" height="1254" fetchpriority="high">
        </picture>
      </figure>

      <p class="fine-print">Battery-free NFC · Physical hardware in development</p>
    </main>
  </body>
</html>
